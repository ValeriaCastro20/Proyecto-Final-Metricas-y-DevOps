name: Rust quality and acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Test CI gate audit (offline, no GitHub credentials)
        run: python3 -m unittest discover -s scripts/tests -v
      - name: MET-05 verifier negative tests (offline, no Azure)
        run: node --test docs/evidencia/MET-05/tests/verification.test.cjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Build code documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Export API contract
        run: cargo run --locked -- openapi > openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: rust-api-and-code-docs
          path: |
            openapi.json
            target/doc

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acceptance
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: events_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U acceptance -d events_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://acceptance:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/events_test
      TEST_DATABASE_URL: postgresql://acceptance:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/events_test
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -- migrate
      - name: PostgreSQL acceptance (missing DB is a failure, not a skip)
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          cargo test --locked --test postgres -- --ignored --nocapture 2>&1 | tee artifacts/postgres.txt
          cargo test --locked --test metrics -- --ignored --nocapture 2>&1 | tee artifacts/metrics.txt
      - name: Restart and recovery experiment
        shell: bash
        env:
          DATABASE_URL: postgresql://events:ci-system-${{ github.run_id }}@127.0.0.1:15434/events_test
          POSTGRES_USER: events
          POSTGRES_PASSWORD: ci-system-${{ github.run_id }}
          POSTGRES_DB: events_test
          POSTGRES_PORT: '15434'
          EVENT_PRODUCER_KEY: ci-producer-${{ github.run_id }}
          EVENT_ANALYST_KEY: ci-analyst-${{ github.run_id }}
        run: |
          set -o pipefail
          cargo build --locked --bin event-service
          cargo run --locked --example verify_system 2>&1 | tee artifacts/recovery.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-postgres-evidence
          path: artifacts/

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full Git history for secrets
        run: bash scripts/scan-secrets.sh

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build non-root runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: event-service:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify hardening, vulnerabilities and SBOM
        run: bash scripts/verify-image.sh event-service:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-security-evidence
          path: artifacts/image/
