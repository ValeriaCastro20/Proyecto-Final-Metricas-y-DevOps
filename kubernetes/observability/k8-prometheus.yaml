apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: eventos-development
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    rule_files:
      - "/etc/prometheus/alerts.yml"
    scrape_configs:
      - job_name: 'event-service'
        static_configs:
          - targets: ['api.eventos-development.svc.cluster.local:8000']
  alerts.yml: |
    groups:
      - name: esc3-alerts
        rules:
          - alert: HighProcessorLatency
            expr: rate(esc3_processor_duration_seconds_sum[1m]) / rate(esc3_processor_duration_seconds_count[1m]) > 0.5
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Alta latencia en procesamiento de eventos"
              description: "El tiempo medio de procesamiento superó los 0.5s en el último minuto."
          - alert: HighEventBacklog
            expr: esc3_events_backlog_total > 100
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Acumulación crítica de eventos"
              description: "El inbox transaccional tiene más de 100 eventos sin procesar."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: eventos-development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.retention.time=2d"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: eventos-development
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
  selector:
    app: prometheus