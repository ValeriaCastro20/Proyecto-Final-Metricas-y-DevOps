apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: eventos-development
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    rule_files:
      - "/etc/prometheus/alerts.yml"
    scrape_configs:
      - job_name: 'event-service'
        static_configs:
          - targets: ['event-service.eventos-development.svc.cluster.local:8000']
      - job_name: 'event-service-worker'
        static_configs:
          - targets: ['event-service-worker-metrics.eventos-development.svc.cluster.local:9000']
  alerts.yml: |
    groups:
      - name: esc3-alerts
        rules:
          - alert: HighProcessorLatency
            expr: rate(esc3_processor_duration_seconds_sum[1m]) / rate(esc3_processor_duration_seconds_count[1m]) > 0.5
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Alta latencia en procesamiento de eventos"
              description: "El tiempo medio de procesamiento superó los 0.5s en el último minuto."
          - alert: HighEventBacklog
            expr: esc3_events_backlog_total > 100
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Acumulación crítica de eventos"
              description: "El inbox transaccional tiene más de 100 eventos sin procesar."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: eventos-development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: prom/prometheus:v3.2.1
        securityContext:
          runAsUser: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.retention.time=2d"
          - "--storage.tsdb.path=/prometheus"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-data
          mountPath: /prometheus
        - name: config-volume
          mountPath: /etc/prometheus
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
      volumes:
      - name: prometheus-data
        emptyDir: {}
      - name: config-volume
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: eventos-development
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
  selector:
    app: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: event-service-worker-metrics
  namespace: eventos-development
spec:
  ports:
  - port: 9000
    targetPort: 9000
    name: metrics
  selector:
    app.kubernetes.io/name: event-service
    app.kubernetes.io/component: worker
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-scrape
  namespace: eventos-development
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: event-service
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: event-service-metrics
  namespace: eventos-development
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: event-service
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9000
